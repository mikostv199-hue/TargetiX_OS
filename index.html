<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetiX — Програмне Забезпечення</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      color: #2d3748;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 20px 48px rgba(0, 0, 0, 0.03);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    .logo-container {
      margin-bottom: 1.25rem;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #0066ff;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 102, 255, 0.25);
    }
    .logo svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
      letter-spacing: -0.5px;
    }
    p {
      color: #718096;
      font-size: 0.95rem;
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
    }
    select {
      width: 100%;
      padding: 12px 16px;
      background-color: #f8fafc;
      color: #1a202c;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus {
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    /* Блок з попередженням */
    .alert-box {
      background-color: #fffaf0;
      border: 1px solid #feebc8;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .alert-icon {
      color: #dd6b20;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .alert-text {
      color: #c05621;
      font-size: 0.85rem;
      line-height: 1.4;
      font-weight: 500;
    }
    button {
      background-color: #0066ff;
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #0052cc;
    }
    button:active {
      transform: scale(0.98);
    }
    .warning {
      color: #e53e3e;
      font-size: 0.85rem;
      margin-top: 15px;
      display: block;
    }
  </style>
  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
  </script>
</head>
<body>

  <div class="card">
    <!-- Логотип -->
    <div class="logo-container">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
      </div>
    </div>

    <h1>TargetiX Web Tool</h1>
    <p>Підключіть пристрій через USB та перевірте вибрану модель.</p>

    <!-- Вибір номера тренажера -->
    <div class="field">
      <label for="device-select">Номер та модель тренажера</label>
      <select id="device-select">
        <option value="">Завантаження даних...</option>
      </select>
    </div>

    <!-- Попередження щодо вибору -->
    <div class="alert-box">
      <div class="alert-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div class="alert-text">
        Будьте уважні! Переконайтеся, що ви підключаєте саме тренажер TargetiX SL7.
      </div>
    </div>

    <!-- Кнопка установки -->
    <esp-web-install-button id="install-btn">
      <button slot="activate">Встановити програму</button>
      <span slot="unsupported" class="warning">
        Ваш браузер не підтримує Web Serial API. Використовуйте Chrome або Edge.
      </span>
      <span slot="not-allowed" class="warning">
        Робота можлива тільки через захищене з'єднання HTTPS.
      </span>
    </esp-web-install-button>
  </div>

  <script>
    const selectEl = document.getElementById('device-select');
    const installBtn = document.getElementById('install-btn');

    // Завантаження списку з versions.json
    fetch('./versions.json')
      .then(response => {
        if (!response.ok) throw new Error('Не вдалося завантажити конфігурацію');
        return response.json();
      })
      .then(devices => {
        selectEl.innerHTML = '';

        devices.forEach((item) => {
          const option = document.createElement('option');
          option.value = item.manifest;
          option.textContent = item.name || item.device;
          selectEl.appendChild(option);
        });

        if (devices.length > 0) {
          installBtn.setAttribute('manifest', devices[0].manifest);
        }
      })
      .catch(error => {
        console.error('Помилка:', error);
        selectEl.innerHTML = '<option value="">Помилка завантаження даних</option>';
      });

    selectEl.addEventListener('change', (e) => {
      if (e.target.value) {
        installBtn.setAttribute('manifest', e.target.value);
      }
    });
  </script>

</body>
</html>
